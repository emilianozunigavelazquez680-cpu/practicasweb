<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registro de Muertes</title>
</head>
<body>

    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1>Registro de Muertes</h1>
        <p>Registro durante 7 días</p>
    </header>

    <section class="container mt-5">
        <h3>Captura de datos</h3>

        <button class="btn btn-warning" onclick="cargar()">
            Capturar
        </button>

        <button class="btn btn-success" onclick="mostrar()">
            Mostrar
        </button>

        <hr>

        <h3>Muertes por día</h3>
        <p id="impMuertes"></p>

        <h3>Resultados</h3>
        <p id="impResultados"></p>
    </section>

    <script src="js/muerte.js"></script>
</body>
</html>
