</head>
<body>
<main>
    <nav class="menu">

            <li><a href="playlist.html">05 Playlist</a></li>
            <li><a href="biografia.html">06 Biografias</a></li>
        </ul>
    </nav>
    <section class="contenido-principal">
        <div class="formulario">
            <h1>Disco</h1>
            <form id="formDisco">
                <label for="nombreDisco">
                    Nombre:
                </label>
                <input
                    type="text"
                    id="nombreDisco"
                    name="nombreDisco"
                    required
                >
                <label for="generoDisco">
                    Género:
                </label>
                <select id="generoDisco" name="generoDisco">
                    <option value="">Seleccionar</option>
                    <option>Pop</option>
                    <option>Rock</option>
                    <option>Reggaetón</option>
                    <option>Rap</option>
                    <option>Regional Mexicano</option>
                    <option>Electrónica</option>
                </select>
                <label for="anioDisco">
                    Año:
                </label>
                <input
                    type="number"
                    id="anioDisco"
                    name="anioDisco"
                >
                <label for="precioDisco">
                    Precio:
                </label>
                <input
                    type="number"
                    id="precioDisco"
                    name="precioDisco"
                >
                <label for="portada">
                    Portada:
                </label>
                <input
                    type="file"
                    id="portada"
                    name="portada"
                    accept="image/*"
                >
                <button type="submit">
                    Guardar
                </button>
                <button type="reset">
                    Limpiar
                </button>
            </form>
        </div>
    </section>
</main>
