<main>
    <nav class="menu">

            <li><a href="actividad2.html">01 Home</a></li>

            <li><a href="biografia.html">06 Biografias</a></li>
        </ul>
    </nav>
    <section class="contenido-principal">
        <div class="formulario">
            <h1>Cantante</h1>
            <form id="formCantante">
                <label for="nombreCantante">
                    Nombre:
                </label>
                <input
                    type="text"
                    id="nombreCantante"
                    name="nombreCantante"
                    required
                >
                <label for="edad">
                    Edad:
                </label>
                <input
                    type="number"
                    id="edad"
                    name="edad"
                >
                <label>
                    Género:
                </label>
                <div class="opciones">
                    <input
                        type="radio"
                        id="femenino"
                        name="sexo"
                        value="Femenino"
                    >
                    <label for="femenino">
                        Femenino
                    </label>
                    <input
                        type="radio"
                        id="masculino"
                        name="sexo"
                        value="Masculino"
                    >
                    <label for="masculino">
                        Masculino
                    </label>
                </div>
                <label for="nacionalidad">
                    Nacionalidad:
                </label>
                <input
                    type="text"
                    id="nacionalidad"
                    name="nacionalidad"
                >
                <label for="trayectoria">
                    Trayectoria:
                </label>
                <textarea
                    id="trayectoria"
                    name="trayectoria"
                ></textarea>
                <label for="foto">
                    Foto:
                </label>
                <input
                    type="file"
                    id="foto"
                    name="foto"
                    accept="image/*"
                >
                <button type="submit">
                    Guardar
                </button>
                <button type="reset">
                    Limpiar
                </button>
            </form>
        </div>
    </section>
</main>
